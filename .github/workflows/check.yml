# 自動確認: PR と main への push のたびに、ヘッドレス Chromium でゲームを一通り動かす（tests/smoke.cjs）
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: スクリーンショットを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 14
