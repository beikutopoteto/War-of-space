<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>地上戦 見本 A — The War of Sol</title>
<style>
:root{--blue:#7fc8ff;--ink:#dce9f3;--dim:#9baebd;--brass:#e3c27d;--panel:rgba(8,14,26,.83)}*{box-sizing:border-box}body{margin:0;background:#182b35;color:var(--ink);font:13px system-ui,sans-serif;overflow:hidden}canvas{display:block}button{font:inherit;cursor:pointer}.plate{background:var(--panel);backdrop-filter:blur(6px);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}.tabs{display:flex;gap:2px}.tabs button{color:var(--dim);border:0;border-bottom:2px solid #405568;background:rgba(8,14,26,.65);padding:6px 20px 5px 12px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%)}.tabs button[aria-expanded=true]{color:var(--ink);background:var(--panel);border-bottom-color:transparent;box-shadow:inset 0 2px var(--blue)}.tabs i,.eyebrow{font-style:italic;color:var(--blue);font-size:10px;letter-spacing:.12em;margin-right:7px}#top{position:absolute;top:16px;left:16px;width:300px}#mission{padding:10px 14px;border-left:3px solid var(--brass);line-height:1.7}h2{font-size:15px;margin:3px 0 6px}p{margin:4px 0;color:var(--dim)}.objective{color:#f0dab0}.progress{height:3px;background:#304754;margin:7px 0}.progress span{display:block;width:42%;height:100%;background:var(--brass)}#alt{position:absolute;bottom:18px;left:16px;width:150px;padding:0 8px 10px}.cap{margin:0 -8px 8px;padding:5px 9px;background:linear-gradient(90deg,#31506b,#192a39);border-top:2px solid var(--blue);font-size:10px;letter-spacing:.12em;color:var(--blue)}.altrow{display:flex;gap:3px}.altrow button{flex:1;border:0;color:var(--dim);background:#243d4e;padding:7px 0;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}.altrow button[aria-pressed=true]{background:var(--blue);color:#08121a}#roster{position:absolute;right:16px;bottom:18px;width:244px;padding:0 10px 10px}.row{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid #354956;color:var(--dim)}.row strong{color:var(--ink);font-weight:500}.indent{padding-left:13px}.indent2{padding-left:27px}.n{color:var(--blue)}#clock{position:absolute;right:16px;top:16px;padding:10px 18px;width:225px}.time{font-size:27px;color:var(--brass);line-height:1.1}.small{font-size:10px;color:var(--dim);letter-spacing:.08em}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;display:flex;align-items:center;color:var(--blue);transform:translate(-11px,-50%);filter:drop-shadow(0 1px 3px #000)}.label.red{color:#ff9d91}.icon{width:25px;height:25px;border:1px solid currentColor;border-radius:50%;background:rgba(8,14,26,.76);display:grid;place-items:center}.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linejoin:miter}.flag{background:rgba(8,14,26,.83);border-left:2px solid currentColor;padding:3px 7px;margin-left:3px;color:var(--ink);white-space:nowrap;font-size:11px}.flag b{font-weight:600}.flag small{display:block;color:#a8bdca;font-size:9px}.legend{position:absolute;left:50%;top:18px;transform:translateX(-50%);color:#d6e9ee;background:rgba(8,14,26,.55);padding:5px 12px;font-size:11px;letter-spacing:.08em}.foot{position:absolute;right:270px;bottom:20px;color:#d5e4e8;background:rgba(8,14,26,.55);padding:5px 9px;font-size:10px}
</style></head><body>
<div class="legend">地上戦　/　画面の見本 A</div><div id="top"><div class="tabs"><button aria-expanded="true" data-panel="goal"><i>MISSION</i>任務 ▾</button><button aria-expanded="false" data-panel="brief"><i>BRIEF</i>作戦概要 ▸</button></div><div id="mission" class="plate"><div class="eyebrow">OBJECTIVE / 01</div><h2 id="missionTitle">市街地を確保</h2><div id="missionBody"><div class="objective">◇ 中央拠点を占拠する</div><div class="progress"><span></span></div><p>歩兵を拠点へ進める</p></div></div></div>
<div id="clock" class="plate"><div class="small">GROUND OPERATION</div><div class="time">09:24</div><div class="small">地球連合　青　 /　 惑星共和国　赤</div></div>
<div id="alt" class="plate"><div class="cap">ALTITUDE　高度</div><p>攻撃機　第2中隊</p><div class="altrow"><button aria-pressed="false">地上</button><button aria-pressed="true">低</button><button aria-pressed="false">高</button></div><p class="small">地上は選択できない</p></div>
<div id="roster" class="plate"><div class="cap">FORCES　部隊一覧</div><div class="row"><strong>▾ 第1旅団</strong><span class="n">3 大隊</span></div><div class="row indent"><strong>▾ 第1大隊</strong><span>前進中</span></div><div class="row indent2"><span>◇ 強化歩兵　第1中隊</span><span class="n">12</span></div><div class="row indent2"><span>▱ 主力戦車　第2中隊</span><span class="n">8</span></div><div class="row indent"><strong>▸ 航空大隊</strong><span class="n">2 中隊</span></div><div class="row indent"><strong>▸ 海上支援群</strong><span class="n">2 隻</span></div></div><div class="foot">地上 ／ 低高度 ／ 高高度　　縦線は地表との距離</div><div id="labels"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x253d47);scene.fog=new THREE.Fog(0x253d47,170,390);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,1,700);camera.position.set(130,145,190);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xc9e6ed,0x354334,1));const sun=new THREE.DirectionalLight(0xffe4bb,.8);sun.position.set(-40,100,50);scene.add(sun);
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const land=mat(0x71866b),sea=mat(0x375e6e),river=mat(0x517d8b),city=mat(0xa4a39a),dark=mat(0x445a55),blue=mat(0x81c9e9),red=mat(0xd87d73);const height=(x,z)=>Math.max(0,7*Math.exp(-((x+52)**2+(z+20)**2)/1000)+5*Math.exp(-((x-12)**2+(z-48)**2)/600));
const geo=new THREE.PlaneGeometry(190,180,38,36);geo.rotateX(-Math.PI/2);const p=geo.attributes.position;for(let i=0;i<p.count;i++){let x=p.getX(i)-20,z=p.getZ(i);p.setY(i,height(x,z));}geo.computeVertexNormals();const ground=new THREE.Mesh(geo,land);ground.position.x=-20;scene.add(ground);const water=new THREE.Mesh(new THREE.PlaneGeometry(90,180),sea);water.rotation.x=-Math.PI/2;water.position.set(115,.5,0);scene.add(water);
const rg=new THREE.PlaneGeometry(8,180,1,30);rg.rotateX(-Math.PI/2);const rp=rg.attributes.position;for(let i=0;i<rp.count;i++){let z=rp.getZ(i),x=rp.getX(i)-15+Math.sin(z/24)*8;rp.setX(i,x);rp.setY(i,height(x,z)+.22)}rg.computeVertexNormals();scene.add(new THREE.Mesh(rg,river));
function box(x,z,w,d,h,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,height(x,z)+h/2,z);scene.add(o);return o}for(let x=10;x<42;x+=8)for(let z=-24;z<7;z+=8)box(x,z,5,5,3+((x+z+80)%5),city);box(-15,2,14,5,1,city);
for(let i=0;i<24;i++){let x=-80+(i*17)%54,z=-65+(i*31)%120;box(x,z,3,3,4,dark)}
const labels=[];function unit(x,z,y,kind,name,count,side=0){const color=side?red:blue;const base=height(x,z),at=y===0?base+.5:y;const g=new THREE.Group();let shape;if(kind==='air'||kind==='high'){shape=new THREE.ConeGeometry(3,8,4);shape.rotateX(Math.PI/2)}else if(kind==='ship'){shape=new THREE.BoxGeometry(4,2,15)}else{shape=new THREE.BoxGeometry(6,2,4)}g.add(new THREE.Mesh(shape,color));g.position.set(x,at,z);scene.add(g);if(y>0){let line=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,base,z),new THREE.Vector3(x,at,z)]);scene.add(new THREE.Line(line,new THREE.LineBasicMaterial({color:0x9fdbed,transparent:true,opacity:.65})))}const paths={inf:'<path d="M3 4h18v16H3zM4 5l16 14M20 5L4 19"/>',tank:'<path d="M3 8h18v10H3zM7 13h10M5 6h14"/>',air:'<path d="M12 2l2 7 7 5v2l-7-2-2 7-2-7-7 2v-2l7-5z"/>',high:'<path d="M12 2l2 7 7 5v2l-7-2-2 7-2-7-7 2v-2l7-5z"/>',ship:'<path d="M2 10h20l-3 8H5zM7 10V7h10v3"/>'};const el=document.createElement('div');el.className='label'+(side?' red':'');el.innerHTML='<div class="icon"><svg viewBox="0 0 24 24">'+paths[kind]+'</svg></div><div class="flag"><b>'+name+'　'+count+'</b><small>'+({inf:'地上',tank:'地上',air:'低高度',high:'高高度',ship:'海面'}[kind])+'</small></div>';document.getElementById('labels').appendChild(el);labels.push({el,g});}
unit(-35,15,0,'inf','強化歩兵',12);unit(-54,-8,0,'tank','主力戦車',8);unit(35,-5,0,'inf','共和国 守備隊',10,1);unit(-15,-20,25,'air','攻撃機',6);unit(20,-45,52,'high','戦闘機',4);unit(102,24,2,'ship','海上艦',2);
function render(){renderer.render(scene,camera);labels.forEach(({el,g})=>{const v=g.position.clone().project(camera);el.style.left=(v.x*.5+.5)*innerWidth+'px';el.style.top=(-v.y*.5+.5)*innerHeight+'px'});}render();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render()});document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const open=b.getAttribute('aria-expanded')==='true';document.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));document.getElementById('mission').hidden=open;if(!open){b.setAttribute('aria-expanded','true');document.getElementById('missionTitle').textContent=b.dataset.panel==='goal'?'市街地を確保':'海岸からの前進';document.getElementById('missionBody').innerHTML=b.dataset.panel==='goal'?'<div class="objective">◇ 中央拠点を占拠する</div><div class="progress"><span></span></div><p>歩兵を拠点へ進める</p>':'<p>地上部隊を支援し、都市の拠点を確保する。</p>'}});document.querySelectorAll('.altrow button').forEach((b,i)=>{if(i===0){b.disabled=true;return}b.onclick=()=>{document.querySelectorAll('.altrow button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}});
</script></body></html>
