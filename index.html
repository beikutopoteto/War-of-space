<title>War of Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="battle/battle.css">

<div id="stage"></div>
<div id="labels"></div>
<div id="cursorAlt" hidden></div>
<div id="pick" hidden role="menu" aria-label="敵をクリックしたときの命令"><button data-pk="attack" role="menuitem">攻撃</button><button data-pk="move" role="menuitem">ここへ移動</button></div>

<div id="clock" class="hud"><div class="date" id="date">宙暦0412.07.18　08:00</div><div class="phase" id="phase">布陣</div></div>

<div id="legend" class="hud">
  <div class="row t0"><span id="lg0"></span><span style="color:var(--ink)">地球連合（自軍）</span></div>
  <div class="row t1"><span id="lg1"></span><span style="color:var(--ink)">惑星共和国</span></div>
  <div id="view" role="group" aria-label="表示">
    <button id="vUi" aria-pressed="true" title="パネルの表示切り替え（Hキー）">パネル H</button>
    <button id="vLb" aria-pressed="true" title="名札の表示切り替え（Lキー）">名札 L</button>
  </div>
  <div id="camView" role="group" aria-label="視点（Vキーで順に切り替え）">
    <button id="cv0" data-v="0" aria-pressed="true">斜め</button>
    <button id="cv1" data-v="1" aria-pressed="false">真上</button>
    <button id="cv2" data-v="2" aria-pressed="false">真横</button>
  </div>
  <div id="speed" role="group" aria-label="進行速度">
    <button id="sp0" data-s="0" aria-pressed="false" title="一時停止（Spaceキーで切り替え）">停止</button>
    <button id="sp1" data-s="1" aria-pressed="true">1×</button>
    <button id="sp2" data-s="2" aria-pressed="false">2×</button>
    <button id="sp4" data-s="4" aria-pressed="false">4×</button>
  </div>
</div>

<div id="hint" class="hud">青い艦隊をクリックで選び、宙域をクリックで移動、敵や要塞をクリックすると攻撃か移動を選べます（右クリックでも命令できます）。Shift+クリックで経由地や攻撃を予約。高度は左のバーか Q/E、R で交戦と回避の切り替え。ドラッグで回転、ホイールで拡大、WASD で移動、Space で一時停止。</div>

<div id="azBar" class="hud camBar"><span>横回転</span><div id="azTrack" class="tr" tabindex="0" role="slider" aria-label="視点の横回転（←→キー）" aria-valuemin="-180" aria-valuemax="180"><span id="azKnob" class="kn"></span></div></div>
<div id="elBar" class="hud camBar"><span>上</span><div id="elTrack" class="tr" tabindex="0" role="slider" aria-label="視点の上下角度（↑↓キー）" aria-valuemin="-80" aria-valuemax="88"><span class="lv"></span><span id="elKnob" class="kn"></span></div><span>下</span></div>
<div id="alt" class="hud" hidden aria-label="高度">
  <span class="cap">高度</span>
  <button id="altUp" aria-label="高度を上げる">▲</button>
  <div id="altTrack" tabindex="0" role="slider" aria-label="移動先の高度" aria-valuemin="-60" aria-valuemax="60" aria-valuenow="0"><span class="zero"></span><span id="altKnob"></span></div>
  <button id="altDn" aria-label="高度を下げる">▼</button>
  <span class="val" id="altVal">±0</span>
  <div id="stance" role="group" aria-label="交戦の方針（Rキーで切り替え）">
    <button data-st="engage" aria-pressed="true" title="射程内の敵を撃つ（Rキーで切り替え）">交戦</button>
    <button data-st="evade" aria-pressed="false" title="自分からは撃たない。攻撃を命じた相手だけ撃つ（Rキーで切り替え）">回避</button>
  </div>
</div>

<div id="brief" class="hud" aria-live="polite">
  <div class="t" id="bt">作戦概要</div>
  <h2 id="bh"></h2>
  <p id="bp"></p>
  <ul id="log"></ul>
</div>

<div id="roster" class="hud" aria-label="自軍艦隊"></div>

<div id="talk" hidden aria-live="polite"><b id="talkWho"></b><p id="talkText"></p><div class="ctl"><span>クリック・Enter で次へ</span><button id="talkSkip">とばす</button></div></div>
<div id="result" hidden><div class="card"><h1 id="rh">勝利</h1><p id="rp"></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="again" id="again">もう一度</button><button class="again" id="toMenu" style="background:transparent;color:var(--ink);border:1px solid var(--line)">メニューへ</button></div></div></div>
<div id="menu"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<link rel="stylesheet" href="prep.css">
<script src="data/ships.js"></script>
<script src="data/bonuses.js"></script>
<script src="data/operations.js"></script>
<script src="battle/scene.js"></script>
<script src="battle/effects.js"></script>
<script src="battle/shapes.js"></script>
<script src="battle/units.js"></script>
<script src="battle/state.js"></script>
<script src="battle/hud.js"></script>
<script src="battle/sim.js"></script>
<script src="battle/loop.js"></script>
<script src="prep.js"></script>
